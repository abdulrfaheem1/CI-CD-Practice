name: Task Tracker CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

  defaults:
     run:
       working-directory: ci-cd-project

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci-cd-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Check code style
        run: npm run lint

      - name: Build the frontend and check the backend
        run: npm run build
